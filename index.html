<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#e4b51c"/><link rel="manifest" href="/manifest.webmanifest"/><link rel="icon" type="image/svg+xml" href="/icons/coworx-icon.svg"/><link rel="apple-touch-icon" href="/icons/coworx-192.png"/><title>Coworx Central · Solapur City</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}</script><script>(function(){var deferred=null,shown=false;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;show();});function show(){if(shown||window.matchMedia("(display-mode: standalone)").matches||localStorage.getItem("coworx-install-dismissed")==="1")return;shown=true;setTimeout(function(){var el=document.createElement("div");el.className="pwaInstallPrompt";el.innerHTML='<div class="pwaInstallIcon"><img src="/icons/coworx-icon.svg" alt="Coworx Central"></div><div class="pwaInstallCopy"><strong>Install Coworx Central</strong><span>Get faster access, a home-screen icon and an app-like booking experience.</span></div><button class="pwaInstallNow">Install</button><button class="pwaInstallClose" aria-label="Close">×</button>';document.body.appendChild(el);el.querySelector('.pwaInstallNow').addEventListener('click',async function(){if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;}localStorage.setItem("coworx-install-dismissed","1");el.remove();});el.querySelector('.pwaInstallClose').addEventListener('click',function(){localStorage.setItem("coworx-install-dismissed","1");el.remove();});},1200);}if(document.readyState!=="loading")show();else window.addEventListener("DOMContentLoaded",show);})();</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}</script></body></html>
