<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#e4b51c"/><link rel="manifest" href="/manifest.webmanifest"/><title>Coworx Central · Solapur City</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script><script>(function(){var selected='';function text(b){return (b.textContent||'').trim()}function setActive(label){document.querySelectorAll('.desktopNav button,.mobileMenu button').forEach(function(b){b.classList.toggle('navActive',text(b)===label||(label==='Manage Booking'&&/^Manager\b/.test(text(b)))||(label==='My Bookings'&&/^My Bookings/.test(text(b)))||(label==='Amenities'&&/^Amenities/.test(text(b))))})}function normalizeManager(){document.querySelectorAll('.desktopNav button,.mobileMenu button').forEach(function(b){var t=text(b);if(/^Manager\b/.test(t)){var suffix=t.slice(7);b.textContent='Manage Booking'+suffix}})}function addOperations(){var desktop=document.querySelector('.desktopNav');if(desktop&&!desktop.querySelector('.opsShortcut')&&Array.from(desktop.querySelectorAll('button')).some(function(b){return text(b)==='Admin'})){var btn=document.createElement('button');btn.className='staffNav opsShortcut';btn.textContent='Operations';btn.onclick=function(){selected='Operations';var admin=Array.from(desktop.querySelectorAll('button')).find(function(b){return text(b)==='Admin'});if(admin)admin.click();setTimeout(function(){var el=document.querySelector('.opsSuite');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});setActive('Operations')},250)};var admin=Array.from(desktop.querySelectorAll('button')).find(function(b){return text(b)==='Admin'});desktop.insertBefore(btn,admin)}var mobile=document.querySelector('.mobileMenu');if(mobile&&!mobile.querySelector('.opsShortcut')&&Array.from(mobile.querySelectorAll('button')).some(function(b){return text(b)==='Admin'})){var mb=document.createElement('button');mb.className='opsShortcut';mb.textContent='Operations';mb.onclick=function(){selected='Operations';var admin=Array.from(mobile.querySelectorAll('button')).find(function(b){return text(b)==='Admin'});if(admin)admin.click();setTimeout(function(){var el=document.querySelector('.opsSuite');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});setActive('Operations')},250)};var ma=Array.from(mobile.querySelectorAll('button')).find(function(b){return text(b)==='Admin'});mobile.insertBefore(mb,ma)}}function protectOwners(){document.querySelectorAll('.staffRow').forEach(function(row){var t=text(row).toLowerCase();if((t.indexOf('vsshegur@gmail.com')>=0||t.indexOf('navingaddam2@gmail.com')>=0)){var btn=Array.from(row.querySelectorAll('button')).find(function(b){return /remove/i.test(text(b))});if(btn){var span=document.createElement('span');span.className='protectedBadge';span.textContent='Super Admin · Protected';btn.replaceWith(span)}}})}function detect(){normalizeManager();addOperations();protectOwners();if(selected==='Operations'&&document.querySelector('.opsSuite')){setActive('Operations');return}selected='';var nav=document.querySelector('.desktopNav');if(!nav)return;var label='';if(document.querySelector('.bookingPage'))label='Book';else if(document.querySelector('.bookingHistoryList'))label='My Bookings';else if(document.querySelector('.offerCards'))label='Offers';else if(document.querySelector('.managerHero'))label='Manage Booking';else if(document.querySelector('.opsSuite'))label='Admin';else if(document.querySelector('.amenities'))label='Amenities';if(label)setActive(label)}document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.desktopNav button,.mobileMenu button');if(!b)return;var t=text(b);if(t==='Operations'){selected='Operations';setActive('Operations')}else {selected=t==='Admin'?'Admin':'';if(/^Manager\b/.test(t)||/^Manage Booking/.test(t))setActive('Manage Booking');else if(/^My Bookings/.test(t))setActive('My Bookings');else if(/^Book/.test(t))setActive('Book');else if(/^Offers/.test(t))setActive('Offers');else if(/^Amenities/.test(t))setActive('Amenities');else if(/^Admin/.test(t))setActive('Admin')}});new MutationObserver(detect).observe(document.getElementById('root'),{childList:true,subtree:true});window.addEventListener('load',detect);setTimeout(detect,300)})();</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}</script></body></html>
