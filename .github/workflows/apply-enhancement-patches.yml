name: Apply enhancement source patches
on:
  push:
    branches: [feature/operations-enhancements-sep2026]
    paths:
      - scripts/apply-enhancement-patches.py
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/operations-enhancements-sep2026
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-enhancement-patches.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/OperationsSuite.tsx src/pages/CustomerHome.tsx firestore.rules
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire homepage content and closure enhancements"
          git push origin HEAD:feature/operations-enhancements-sep2026
