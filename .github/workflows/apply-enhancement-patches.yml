name: Repair OperationsSuite JSX
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-enhancement-patches.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-enhancement-patches.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/OperationsSuite.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix OperationsSuite JSX fragment placement"
          git push origin HEAD:main
