name: Restore customer booking flow
on:
  push:
    branches: [main]
    paths:
      - 'scripts/restore-customer-booking-flow.py'
      - '.github/workflows/restore-customer-booking-flow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/restore-customer-booking-flow.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Booking.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Restore customer workspace booking and require final details"
          git push
