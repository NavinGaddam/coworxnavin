name: Fix OperationsSuite syntax
on:
  push:
    branches: [main]
    paths:
      - scripts/fix-operations-syntax.py
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix-operations-syntax.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/OperationsSuite.tsx
          git commit -m "Fix OperationsSuite JSX syntax"
          git push origin HEAD:main
