name: Fix staff booking layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace semantic header container
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/Booking.tsx')
          text = p.read_text(encoding='utf-8')
          old = '<header className="bookingIntro">'
          new = '<div className="bookingIntro">'
          if old not in text:
              raise SystemExit('bookingIntro opening tag not found')
          text = text.replace(old, new, 1)
          # Only replace the corresponding closing tag in the Booking component.
          marker = '</div>{modal&&<ProfileModal'
          if marker in text:
              text = text.replace(marker, '</div>{modal&&<ProfileModal', 1)
          else:
              raise SystemExit('booking modal marker not found')
          # The original closing tag is immediately before bookingGrid. Replace the first matching occurrence.
          boundary = '</header><div className="bookingGrid">'
          if boundary not in text:
              raise SystemExit('bookingIntro closing boundary not found')
          text = text.replace(boundary, '</div><div className="bookingGrid">', 1)
          p.write_text(text, encoding='utf-8')
      - name: Add defensive scoped layout CSS
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/booking.css')
          text = p.read_text(encoding='utf-8')
          css = '''\n/* Staff booking header is a content block, not the global app header. */\n.bookingIntro{position:relative!important;height:auto!important;min-height:0!important;display:grid!important;align-items:end!important;overflow:visible!important;background:transparent!important;border:0!important;padding:0!important;backdrop-filter:none!important;top:auto!important;z-index:1!important}\n.bookingIntro .customerBox{position:relative!important;inset:auto!important;z-index:1!important}\n@media(max-width:900px){.bookingIntro{display:grid!important}}\n'''
          if 'Staff booking header is a content block' not in text:
              p.write_text(text + css, encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Booking.tsx src/pages/booking.css .github/workflows/fix-booking-intro-layout.yml
          git rm --cached .github/workflows/fix-booking-intro-layout.yml 2>/dev/null || true
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Fix walk-in booking header overlap'
          git push
