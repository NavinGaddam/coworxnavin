name: Fix WhatsApp mobile validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix mobile validation and remove workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/Booking.tsx')
          text = p.read_text(encoding='utf-8')
          old_snippets = [
              r'if(!/^\\+?[0-9\\s()-]{10,18}$/.test(phone))return setMessage("Enter a valid mobile number.");',
              r'if(!/^\\\\+?[0-9\\\\s()-]{10,18}$/.test(phone))return setMessage("Enter a valid mobile number.");'
          ]
          replacement = 'if(phone.replace(/\\D/g,"").length<10)return setMessage("Enter a valid mobile number.");'
          changed = False
          for old in old_snippets:
              if old in text:
                  text = text.replace(old, replacement)
                  changed = True
          if not changed:
              raise SystemExit('Expected mobile validation pattern was not found.')
          p.write_text(text, encoding='utf-8')
          wf = Path('.github/workflows/fix-whatsapp-mobile.yml')
          wf.unlink(missing_ok=True)

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Booking.tsx .github/workflows/fix-whatsapp-mobile.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix WhatsApp mobile validation'
          git push