name: Update full-advance tests
on:
  push:
    branches: [main]
    paths:
      - scripts/update-tests-full-advance.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update-tests-full-advance.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/firestore.rules.test.ts
          git commit -m "Update rules tests for full-advance policy"
          git push origin HEAD:main
