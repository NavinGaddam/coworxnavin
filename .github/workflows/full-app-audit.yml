name: Full app audit and repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair shell and profile settings
        shell: python
        run: |
          from pathlib import Path
          import re
          app=Path('src/App.tsx'); t=app.read_text()
          # One Operations route only, centered by the existing page system.
          pattern=r'\s*\{page===\"operations\"&&user&&role===\"Admin\"&&<OperationsSuite users=\{users\} bookings=\{staffBookings\} admins=\{admins\} adminLogs=\{adminLogs\} actorUid=\{user\.uid\} actorEmail=\{user\.email\|\|\"\"\} onFlash=\{setFlash\}/>}\s*\{page===\"operations\"&&user&&role===\"Admin\"&&<main className=\"simple\"><OperationsSuite users=\{users\} bookings=\{staffBookings\} admins=\{admins\} adminLogs=\{adminLogs\} actorUid=\{user\.uid\} actorEmail=\{user\.email\|\|\"\"\} onFlash=\{setFlash\}/></main>}'
          one='{page==="operations"&&user&&role==="Admin"&&<main className="page opsPage"><OperationsSuite users={users} bookings={staffBookings} admins={admins} adminLogs={adminLogs} actorUid={user.uid} actorEmail={user.email||""} onFlash={setFlash}/></main>}'
          t,n=re.subn(pattern,' '+one,t,1)
          if n!=1:
            # Fallback: collapse any two operation route blocks and insert one before Admin.
            t=re.sub(r'\s*\{page===\"operations\"&&user&&role===\"Admin\"&&<OperationsSuite[^}]*?/>\}','',t,1)
            t=re.sub(r'\s*\{page===\"operations\"&&user&&role===\"Admin\"&&<main className=\"simple\"><OperationsSuite.*?</main>\}','',t,1,flags=re.S)
            marker='{page==="admin"&&user&&role==="Admin"&&<AdminPage'
            if marker not in t: raise SystemExit('Operations/Admin route marker missing')
            t=t.replace(marker,one+' '+marker,1)
          # Prevent a second validation rule from rejecting formatted phone numbers.
          t=t.replace('if(!/^\\+?[0-9\\s()-]{10,18}$/.test(phone))return setFlash("Enter a valid mobile number.");','if(phone.replace(/\\D/g,"").length<10)return setFlash("Enter a valid mobile number.");')
          # Profile state and handlers.
          state='const [user,setUser]=useState<any>(null),[role,setRole]=useState<Role>("User"),[page,setPage]=useState("home"),[menuOpen,setMenuOpen]=useState(false),[isMobile,setIsMobile]=useState(()=>typeof window!=="undefined"&&window.innerWidth<=900),[theme,setTheme]=useState<"dark"|"light">((localStorage.getItem("coworx-theme") as any)||"dark");'
          if 'const [profileOpen,setProfileOpen]' not in t:
            if state not in t: raise SystemExit('Profile state marker missing')
            t=t.replace(state,state+'\n const [profileOpen,setProfileOpen]=useState(false),[profileForm,setProfileForm]=useState<any>({mobile:"",gender:"",dob:"",profession:""}),[profileSaving,setProfileSaving]=useState(false);',1)
          nav='const nav=(p:string)=>{if(p==="book"&&!user){setPage("login");setFlash("Google sign-in is required before booking.");return}setPage(p);setMenuOpen(false)};'
          if 'const openProfile=' not in t:
            if nav not in t: raise SystemExit('Navigation marker missing')
            extra='''\n const openProfile=async()=>{if(!user)return;try{const existing=await getUserByEmail(user.email||"");setProfileForm({mobile:existing?.phone||localStorage.getItem("coworx-phone")||"",gender:existing?.gender||"",dob:existing?.dob||"",profession:existing?.profession||""})}catch{setProfileForm({mobile:localStorage.getItem("coworx-phone")||"",gender:"",dob:"",profession:""})}setProfileOpen(true)};\n const saveProfile=async()=>{if(!user)return;const mobile=String(profileForm.mobile||"").trim();if(mobile.replace(/\\D/g,"").length<10){setFlash("Enter a valid mobile number.");return}if(!String(profileForm.profession||"").trim()){setFlash("Select your profession.");return}setProfileSaving(true);try{await saveUserProfile(user.uid,{phone:mobile,gender:String(profileForm.gender||""),dob:String(profileForm.dob||""),profession:String(profileForm.profession||"")});localStorage.setItem("coworx-phone",mobile);setProfileOpen(false);setFlash("Profile details updated.")}catch(e:any){setFlash(e?.message||"Could not update profile")}finally{setProfileSaving(false)}};'''
            t=t.replace(nav,nav+extra,1)
          email_old='<span className="emailChip">{user.email}</span><button className="logout" onClick={()=>signOut(auth)}>'
          email_new='<button className="emailChip profileChip" onClick={openProfile} title="Account settings"><span>{user.email}</span><Settings2 size={14}/></button><button className="logout" onClick={()=>signOut(auth)}>'
          if 'className="profileChip"' not in t:
            if email_old not in t: raise SystemExit('Email chip marker missing')
            t=t.replace(email_old,email_new,1)
          modal='''{profileOpen&&user&&<div className="modalBackdrop profileSettingsBackdrop"><div className="profileSettingsCard"><div className="profileSettingsHead"><div><span className="eyebrow">ACCOUNT SETTINGS</span><h3>Your details</h3><p>Update the contact and professional details used for Coworx Central bookings.</p></div><button className="ghost small" onClick={()=>setProfileOpen(false)}>Close</button></div><div className="profileIdentity"><strong>{user.displayName||"Coworx Member"}</strong><span>{user.email}</span></div><div className="profileSettingsGrid"><label>Mobile number *<input type="tel" inputMode="tel" value={profileForm.mobile||""} onChange={e=>setProfileForm({...profileForm,mobile:e.target.value})} placeholder="+91 98765 43210"/></label><label>Gender<select value={profileForm.gender||""} onChange={e=>setProfileForm({...profileForm,gender:e.target.value})}><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select></label><label>Date of birth<input type="date" value={profileForm.dob||""} onChange={e=>setProfileForm({...profileForm,dob:e.target.value})}/></label><label>Profession<select value={profileForm.profession||""} onChange={e=>setProfileForm({...profileForm,profession:e.target.value})}><option value="">Select profession</option><option>IT Professional</option><option>Developer</option><option>Tester</option><option>Marketing Team</option><option>Student</option><option>Designer</option><option>Consultant</option><option>Business</option><option>Other</option></select></label></div><div className="profileSettingsFooter"><small>Google name and email stay connected to your Google account.</small><button className="primary" onClick={saveProfile} disabled={profileSaving}>{profileSaving?"Saving…":"Save details"}</button></div></div></div>}'''
          if 'profileSettingsBackdrop' not in t:
            marker='<footer><b>coworx central</b>'
            if marker not in t: raise SystemExit('Footer marker missing')
            t=t.replace(marker,modal+marker,1)
          # Robust text wordmark; avoids silent image failure on desktop.
          logo_old='const Logo=()=> <span className="coworxLogoImageWrap"><img className="coworxLogoImage" src={COWORX_LOGO} alt="coworx central" loading="eager" decoding="sync" onError={e=>{e.currentTarget.style.display="none"}} /></span>;'
          logo_new='const Logo=()=> <span className="coworxLogoWordmark" aria-label="coworx central"><span><i>co</i>worx</span><small>CENTRAL</small></span>;'
          if logo_old in t: t=t.replace(logo_old,logo_new,1)
          app.write_text(t)

          css=Path('src/branding.css'); c=css.read_text()
          # Remove old global theme/header overrides and append narrowly scoped shell rules.
          c=re.sub(r'^:root\{[^\n]+\}:root\[data-theme="dark"\]\{[^\n]+\}\n','',c,count=1,flags=re.M)
          c=re.sub(r'^header\{background:[^\n]+\} :root\[data-theme="dark"\] header\{[^\n]+\}\n','',c,count=1,flags=re.M)
          c+='''\n/* audited shell fixes */\n.coworxLogoWordmark{display:grid!important;justify-items:start!important;align-content:center!important;width:178px!important;height:58px!important;line-height:1!important}.coworxLogoWordmark>span{font-size:31px!important;font-weight:950!important;letter-spacing:-2.7px!important;color:#294985!important}.coworxLogoWordmark i{font-style:normal!important;color:#f47b20!important}.coworxLogoWordmark small{font-size:10px!important;font-weight:900!important;letter-spacing:1.9px!important;color:#294985!important;margin:3px 0 0 1px!important}.desktopNav .navActive,.desktopNav .staffNav.navActive,.mobileMenu .navActive{color:var(--text)!important;background:var(--soft)!important;box-shadow:0 0 0 1px var(--line),inset 0 -2px 0 var(--line)!important;border-radius:10px!important}.desktopNav .staffNav{color:var(--text)!important;background:transparent!important}.opsPage{width:min(1200px,92%)!important;max-width:1200px!important;margin:0 auto!important;padding:50px 0 80px!important}.opsPage .opsSuite{width:100%!important;margin:0!important}.profileChip{cursor:pointer!important;display:flex!important;align-items:center!important;gap:6px!important;max-width:220px!important;white-space:nowrap!important;overflow:hidden!important}.profileChip span{overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}.profileSettingsBackdrop{z-index:100!important}.profileSettingsCard{width:min(640px,calc(100vw - 28px));max-height:90vh;overflow:auto;padding:26px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 32px 100px rgba(0,0,0,.48)}.profileSettingsHead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.profileSettingsHead h3{font-size:28px;margin:6px 0 7px}.profileSettingsHead p{margin:0;color:var(--muted);line-height:1.5;font-size:13px}.profileIdentity{display:grid;gap:3px;padding:14px 16px;margin:20px 0;border:1px solid var(--line);border-radius:14px;background:var(--soft)}.profileIdentity strong{font-size:16px}.profileIdentity span{font-size:12px;color:var(--muted)}.profileSettingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.profileSettingsGrid label{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:800}.profileSettingsGrid input,.profileSettingsGrid select{width:100%;height:48px;padding:0 13px;border:1px solid var(--line);border-radius:13px;background:var(--soft);color:var(--text);outline:none}.profileSettingsFooter{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.profileSettingsFooter small{color:var(--muted);line-height:1.45}@media(max-width:900px){.coworxLogoWordmark{width:150px!important}.coworxLogoWordmark>span{font-size:27px!important}.opsPage{width:min(92%,1200px)!important;padding-top:36px!important}.profileChip{max-width:170px!important}.profileSettingsCard{padding:20px;border-radius:20px}.profileSettingsGrid{grid-template-columns:1fr}.profileSettingsFooter{display:grid;grid-template-columns:1fr}.profileSettingsFooter .primary{width:100%!important}}@media(max-width:620px){.coworxLogoWordmark{width:132px!important}.coworxLogoWordmark>span{font-size:25px!important}.profileChip{width:40px!important;min-width:40px!important;justify-content:center!important}.profileChip span{display:none}.opsPage{padding-top:30px!important}}\n'''
          css.write_text(c)

      - name: Full structural audit and production build
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx').read_text(); booking=Path('src/pages/Booking.tsx').read_text(); index=Path('index.html').read_text(); manifest=Path('public/manifest.webmanifest').read_text()
          assert app.count('page==="operations"') == 1
          assert 'className="page opsPage"' in app
          assert 'profileSettingsCard' in app and 'className="profileChip"' in app
          assert '<div className="bookingIntro">' in booking and '<header className="bookingIntro">' not in booking
          assert 'manifest.webmanifest' in index and 'beforeinstallprompt' in index
          assert 'Coworx Central' in manifest and 'coworx-192.png' in manifest and 'coworx-512.png' in manifest
          assert not Path('public/design-qa.css').exists()
          print('STRUCTURAL AUDIT PASSED')
          PY
          npm install
          npm run build

      - name: Verify build and remove audit workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/branding.css public/design-qa.css .github/workflows/full-app-audit.yml
          git commit -m 'Audit and stabilize responsive app shell' || exit 0
          git push
