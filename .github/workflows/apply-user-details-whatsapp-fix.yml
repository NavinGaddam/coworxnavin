name: Apply compulsory user details WhatsApp fix
on:
  push:
    branches: [main]
    paths:
      - 'scripts/require-user-details-before-whatsapp.py'
      - '.github/workflows/apply-user-details-whatsapp-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/require-user-details-before-whatsapp.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Booking.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Require complete user details before WhatsApp booking"
          git push
