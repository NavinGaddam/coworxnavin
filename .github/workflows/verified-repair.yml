name: Verified app repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair source
        shell: python
        run: |
          from pathlib import Path
          import re
          app=Path('src/App.tsx'); t=app.read_text()
          a='{page==="operations"&&user&&role==="Admin"&&<OperationsSuite users={users} bookings={staffBookings} admins={admins} adminLogs={adminLogs} actorUid={user.uid} actorEmail={user.email||""} onFlash={setFlash}/>}'
          b='{page==="operations"&&user&&role==="Admin"&&<main className="simple"><OperationsSuite users={users} bookings={staffBookings} admins={admins} adminLogs={adminLogs} actorUid={user.uid} actorEmail={user.email||""} onFlash={setFlash}/></main>}'
          one='{page==="operations"&&user&&role==="Admin"&&<main className="page opsPage"><OperationsSuite users={users} bookings={staffBookings} admins={admins} adminLogs={adminLogs} actorUid={user.uid} actorEmail={user.email||""} onFlash={setFlash}/></main>}'
          if a in t and b in t: t=t.replace(a+' '+b,one,1)
          elif t.count('&&<OperationsSuite')>1:
            t=t.replace(a,'',1); t=t.replace(b,one,1)
          t=t.replace('import {LogIn,LogOut,Menu,ShieldCheck,X} from "lucide-react";','import {LogIn,LogOut,Menu,Settings2,ShieldCheck,X} from "lucide-react";',1)
          state='const [user,setUser]=useState<any>(null),[role,setRole]=useState<Role>("User"),[page,setPage]=useState("home"),[menuOpen,setMenuOpen]=useState(false),[isMobile,setIsMobile]=useState(()=>typeof window!=="undefined"&&window.innerWidth<=900),[theme,setTheme]=useState<"dark"|"light">((localStorage.getItem("coworx-theme") as any)||"dark");'
          if 'const [profileOpen,setProfileOpen]' not in t:
            t=t.replace(state,state+'\n const [profileOpen,setProfileOpen]=useState(false),[profileForm,setProfileForm]=useState<any>({mobile:"",gender:"",dob:"",profession:""}),[profileSaving,setProfileSaving]=useState(false);',1)
          nav='const nav=(p:string)=>{if(p==="book"&&!user){setPage("login");setFlash("Google sign-in is required before booking.");return}setPage(p);setMenuOpen(false)};'
          if 'const openProfile=' not in t:
            extra='\n const openProfile=async()=>{if(!user)return;try{const u=await getUserByEmail(user.email||"");setProfileForm({mobile:u?.phone||localStorage.getItem("coworx-phone")||"",gender:u?.gender||"",dob:u?.dob||"",profession:u?.profession||""})}catch{setProfileForm({mobile:localStorage.getItem("coworx-phone")||"",gender:"",dob:"",profession:""})}setProfileOpen(true)};\n const saveProfile=async()=>{if(!user)return;const mobile=String(profileForm.mobile||"").trim();if(mobile.replace(/\\D/g,"").length<10){setFlash("Enter a valid mobile number.");return}if(!String(profileForm.profession||"").trim()){setFlash("Select your profession.");return}setProfileSaving(true);try{await saveUserProfile(user.uid,{phone:mobile,gender:String(profileForm.gender||""),dob:String(profileForm.dob||""),profession:String(profileForm.profession||"")});localStorage.setItem("coworx-phone",mobile);setProfileOpen(false);setFlash("Profile details updated.")}catch(e:any){setFlash(e?.message||"Could not update profile")}finally{setProfileSaving(false)}};'
            t=t.replace(nav,nav+extra,1)
          if 'className="profileChip"' not in t:
            t=t.replace('<span className="emailChip">{user.email}</span>','<button className="emailChip profileChip" onClick={openProfile} title="Account settings"><span>{user.email}</span><Settings2 size={14}/></button>',1)
          if 'function ProfileSettings' not in t:
            marker='<footer><b>coworx central</b>'
            comp='{profileOpen&&user&&<ProfileSettings profileForm={profileForm} setProfileForm={setProfileForm} onClose={()=>setProfileOpen(false)} onSave={saveProfile} saving={profileSaving} name={user.displayName||"Coworx Member"} email={user.email||""}/>}'
            t=t.replace(marker,comp+marker,1)
            t+='\nfunction ProfileSettings({profileForm,setProfileForm,onClose,onSave,saving,name,email}:any){return <div className="modalBackdrop profileSettingsBackdrop"><div className="profileSettingsCard"><div className="profileSettingsHead"><div><span className="eyebrow">ACCOUNT SETTINGS</span><h3>Your details</h3><p>Update the contact and professional details used for Coworx Central bookings.</p></div><button className="ghost small" onClick={onClose}>Close</button></div><div className="profileIdentity"><strong>{name}</strong><span>{email}</span></div><div className="profileSettingsGrid"><label>Mobile number *<input type="tel" inputMode="tel" value={profileForm.mobile||""} onChange={e=>setProfileForm({...profileForm,mobile:e.target.value})} placeholder="+91 98765 43210"/></label><label>Gender<select value={profileForm.gender||""} onChange={e=>setProfileForm({...profileForm,gender:e.target.value})}><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select></label><label>Date of birth<input type="date" value={profileForm.dob||""} onChange={e=>setProfileForm({...profileForm,dob:e.target.value})}/></label><label>Profession<select value={profileForm.profession||""} onChange={e=>setProfileForm({...profileForm,profession:e.target.value})}><option value="">Select profession</option><option>IT Professional</option><option>Developer</option><option>Tester</option><option>Marketing Team</option><option>Student</option><option>Designer</option><option>Consultant</option><option>Business</option><option>Other</option></select></label></div><div className="profileSettingsFooter"><small>Google name and email stay connected to your Google account.</small><button className="primary" onClick={onSave} disabled={saving}>{saving?"Saving…":"Save details"}</button></div></div></div>}\n'
          t=t.replace('if(!/^\\+?[0-9\\s()-]{10,18}$/.test(phone))return setFlash("Enter a valid mobile number.");','if(phone.replace(/\\D/g,"").length<10)return setFlash("Enter a valid mobile number.");')
          logo='const Logo=()=> <span className="coworxLogoImageWrap"><img className="coworxLogoImage" src={COWORX_LOGO} alt="coworx central" loading="eager" decoding="sync" onError={e=>{e.currentTarget.style.display="none"}} /></span>;'
          if logo in t: t=t.replace(logo,'const Logo=()=> <span className="coworxLogoWordmark" aria-label="coworx central"><span><i>co</i>worx</span><small>CENTRAL</small></span>;',1)
          app.write_text(t)
          cssp=Path('src/branding.css'); c=cssp.read_text()
          c=re.sub(r'^:root\{[^\n]+\}:root\[data-theme="dark"\]\{[^\n]+\}\n','',c,count=1,flags=re.M)
          c=re.sub(r'^header\{background:[^\n]+\} :root\[data-theme="dark"\] header\{[^\n]+\}\n','',c,count=1,flags=re.M)
          c+='\n/* VERIFIED SHELL */\n.coworxLogoWordmark{display:grid!important;justify-items:start!important;align-content:center!important;width:178px!important;height:58px!important;line-height:1!important}.coworxLogoWordmark>span{font-size:31px!important;font-weight:950!important;letter-spacing:-2.7px!important;color:#294985!important}.coworxLogoWordmark i{font-style:normal!important;color:#f47b20!important}.coworxLogoWordmark small{font-size:10px!important;font-weight:900!important;letter-spacing:1.9px!important;color:#294985!important;margin:3px 0 0 1px!important}.desktopNav .navActive,.mobileMenu .navActive{color:var(--text)!important;background:var(--soft)!important;box-shadow:0 0 0 1px var(--line),inset 0 -2px 0 var(--line)!important;border-radius:10px!important}.desktopNav .staffNav{color:var(--text)!important;background:transparent!important}.opsPage{width:min(1200px,92%)!important;max-width:1200px!important;margin:0 auto!important;padding:50px 0 80px!important}.opsPage .opsSuite{width:100%!important;margin:0!important}.profileChip{cursor:pointer!important;display:flex!important;align-items:center!important;gap:6px!important;max-width:220px!important;white-space:nowrap!important;overflow:hidden!important}.profileChip span{overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}.profileSettingsBackdrop{z-index:100!important}.profileSettingsCard{width:min(640px,calc(100vw - 28px));max-height:90vh;overflow:auto;padding:26px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 32px 100px rgba(0,0,0,.48)}.profileSettingsHead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.profileSettingsHead h3{font-size:28px;margin:6px 0 7px}.profileSettingsHead p{margin:0;color:var(--muted);line-height:1.5;font-size:13px}.profileIdentity{display:grid;gap:3px;padding:14px 16px;margin:20px 0;border:1px solid var(--line);border-radius:14px;background:var(--soft)}.profileIdentity strong{font-size:16px}.profileIdentity span{font-size:12px;color:var(--muted)}.profileSettingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.profileSettingsGrid label{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:800}.profileSettingsGrid input,.profileSettingsGrid select{width:100%;height:48px;padding:0 13px;border:1px solid var(--line);border-radius:13px;background:var(--soft);color:var(--text);outline:none}.profileSettingsFooter{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.profileSettingsFooter small{color:var(--muted);line-height:1.45}@media(max-width:900px){.coworxLogoWordmark{width:150px!important}.coworxLogoWordmark>span{font-size:27px!important}.opsPage{width:min(92%,1200px)!important;padding-top:36px!important}.profileChip{max-width:170px!important}.profileSettingsCard{padding:20px;border-radius:20px}.profileSettingsGrid{grid-template-columns:1fr}.profileSettingsFooter{display:grid;grid-template-columns:1fr}.profileSettingsFooter .primary{width:100%!important}}@media(max-width:620px){.coworxLogoWordmark{width:132px!important}.coworxLogoWordmark>span{font-size:25px!important}.profileChip{width:40px!important;min-width:40px!important;justify-content:center!important}.profileChip span{display:none}.opsPage{padding-top:30px!important}}\n'
          cssp.write_text(c)
          legacy=Path('public/design-qa.css')
          if legacy.exists(): legacy.unlink()
      - name: Build and validate
        shell: bash
        run: |
          set -e
          npm install
          npm run build
          test "$(grep -o '&&<OperationsSuite' src/App.tsx | wc -l)" -eq 1
          grep -q 'className="page opsPage"' src/App.tsx
          grep -q 'className="profileChip"' src/App.tsx
          grep -q 'function ProfileSettings' src/App.tsx
          grep -q '<div className="bookingIntro">' src/pages/Booking.tsx
          ! grep -q '<header className="bookingIntro">' src/pages/Booking.tsx
          grep -q 'beforeinstallprompt' index.html
          grep -q 'coworx-192.png' public/manifest.webmanifest
      - name: Commit verified result and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Verified full app shell and responsive fixes' || exit 0
          git rm .github/workflows/verified-repair.yml
          git commit -m 'Remove temporary repair workflow' || exit 0
          git push
