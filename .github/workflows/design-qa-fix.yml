name: Design QA fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply design and navigation fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app=Path('src/App.tsx')
          s=app.read_text()
          s=s.replace('const resetBook=()=>{setSpace("desk");setSelectedSeats([]);setStaffBooking(false);nav("book")};', 'const resetBook=()=>{setSpace("desk");setSelectedSeats([]);setStaffBooking(false);nav("book")};')
          s=s.replace('<button onClick={resetBook}>Book</button>', '<button className={page==="book"?"active":""} onClick={resetBook}>Book</button>')
          s=s.replace('<button onClick={()=>nav("bookings")}>My Bookings</button>', '<button className={page==="bookings"?"active":""} onClick={()=>nav("bookings")}>My Bookings</button>')
          s=s.replace('<button onClick={()=>nav("offers")}>Offers</button>', '<button className={page==="offers"?"active":""} onClick={()=>nav("offers")}>Offers</button>')
          s=s.replace('<button onClick={()=>nav("amenities")}>Amenities</button>', '<button className={page==="amenities"?"active":""} onClick={()=>nav("amenities")}>Amenities</button>')
          s=s.replace('<button className="staffNav" onClick={()=>nav("manager")}>Manager{pendingBookings.length?` · ${pendingBookings.length}`:""}</button>{role==="Admin"&&user&&<button className="staffNav" onClick={()=>nav("admin")}>Admin</button>}', '<button className={`staffNav ${page==="manager"?"active":""}`} onClick={()=>nav("manager")}>Manage Booking{pendingBookings.length?` · ${pendingBookings.length}`:""}</button>{role==="Admin"&&user&&<><button className="staffNav opsNav" onClick={()=>{nav("admin");setTimeout(()=>document.querySelector(".opsSuite")?.scrollIntoView({behavior:"smooth",block:"start"}),120)}}>Operations</button><button className={`staffNav ${page==="admin"?"active":""}`} onClick={()=>nav("admin")}>Admin</button></>}')
          s=s.replace('<button onClick={()=>nav("manager")}>Manager{pendingBookings.length?` · ${pendingBookings.length}`:""}</button>', '<button className={page==="manager"?"active":""} onClick={()=>nav("manager")}>Manage Booking{pendingBookings.length?` · ${pendingBookings.length}`:""}</button>')
          s=s.replace('{role==="Admin"&&user&&<button onClick={()=>nav("admin")}>Admin</button>}', '{role==="Admin"&&user&&<><button onClick={()=>{nav("admin");setTimeout(()=>document.querySelector(".opsSuite")?.scrollIntoView({behavior:"smooth",block:"start"}),120)}}>Operations</button><button className={page==="admin"?"active":""} onClick={()=>nav("admin")}>Admin</button></>}')
          app.write_text(s)

          other=Path('src/pages/Other.tsx')
          s=other.read_text()
          pat=re.compile(r'<button([^>]*onClick=\{\(\)=>removeAdmin\(email\)\}[^>]*)>(.*?)</button>')
          def repl(m):
              button='<button'+m.group(1)+'>'+m.group(2)+'</button>'
              return '{ADMIN_EMAILS.map(e=>e.toLowerCase()).includes(String(email).toLowerCase()) ? <span className="protectedBadge">Protected</span> : '+button+'}'
          s,n=pat.subn(repl,s,count=1)
          print('protected admin button replacements:',n)
          other.write_text(s)

          branding=Path('src/branding.css')
          c=branding.read_text()
          addon='''
/* 2026 design QA: stable desktop/mobile navigation and spacing */
header{height:82px!important;padding:0 30px!important;gap:24px!important}
.brand{flex:0 0 205px!important;width:205px!important;min-width:205px!important;height:72px!important}
.coworxLogoImageWrap{width:205px!important;height:70px!important}
.coworxLogoImage{width:205px!important;max-width:205px!important;height:70px!important;max-height:70px!important;object-fit:contain!important;object-position:left center!important;visibility:visible!important;opacity:1!important}
.desktopNav{flex:1 1 auto!important;justify-content:center!important;gap:6px!important;min-width:0!important}
.desktopNav button{position:relative!important;padding:12px 14px!important;border-radius:10px!important;white-space:nowrap!important;transition:background .16s ease,color .16s ease,transform .16s ease!important}
.desktopNav button.active{color:var(--accent)!important;background:rgba(244,123,32,.09)!important;box-shadow:inset 0 -2px 0 var(--accent)!important}
.desktopNav .staffNav{font-weight:800!important}
.desktopNav .opsNav{font-weight:800!important}
.headActions{flex:0 0 auto!important;min-width:210px!important;justify-content:flex-end!important}
.simple{padding-top:46px!important}
.offerComposer{width:100%!important;padding:28px!important;margin-top:20px!important;border-radius:22px!important}
.offerFormGrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:16px!important;align-items:end!important}
.offerFormGrid label{min-width:0!important}
.offerFormGrid input,.offerFormGrid select,.offerFormGrid textarea{min-width:0!important}
.composerFooter{margin-top:24px!important;padding-top:20px!important;gap:24px!important}
.queueGrid{grid-template-columns:minmax(0,1.2fr) minmax(430px,.8fr)!important;gap:22px!important}
.teamAccessGrid{gap:22px!important;margin-top:10px!important}
.teamAccessColumn{padding:20px!important;border-radius:16px!important}
.staffList{gap:12px!important}
.staffRow{grid-template-columns:minmax(0,1fr) auto auto!important;gap:14px!important;padding:14px 15px!important;border-radius:13px!important}
.adminAddRow{gap:10px!important;margin-bottom:16px!important}
.adminAddRow button{min-height:44px!important}
.auditPanel{margin-top:24px!important}
.auditList{gap:10px!important}
.auditRow{gap:14px!important;padding:14px 15px!important;border-radius:12px!important}
.protectedBadge{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:7px 10px;border-radius:10px;border:1px solid rgba(244,123,32,.35);background:rgba(244,123,32,.09);color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.03em;white-space:nowrap}
.adminMetrics{gap:14px!important;margin-bottom:24px!important}
.metricCard{padding:18px!important;border-radius:18px!important}
.deskPricingPanel,.userDirectory,.staffQueuePanel{margin-top:24px!important}
.opsSuite{margin-top:34px!important;gap:24px!important}
.opsHeader{gap:28px!important}
.opsHeader h2{font-size:34px!important;line-height:1.08!important;margin:6px 0 10px!important}
.opsTabs{gap:6px!important;padding:5px!important;border-radius:14px!important;position:sticky;top:94px;z-index:6}
.opsTabs button{padding:11px 15px!important}
.opsMetricGrid{gap:14px!important}
.opsMetric{padding:18px!important;min-height:118px!important;border-radius:17px!important}
.opsTwo{gap:22px!important}
.opsPanel{padding:22px!important;border-radius:20px!important}
.topCustomerGrid{gap:12px!important}
.topCustomer{padding:14px!important}
.crmRow{gap:18px!important;padding:18px 0!important}
.crmControls{gap:10px!important}
@media (max-width:1200px){
  header{padding:0 22px!important}
  .brand{flex-basis:175px!important;width:175px!important;min-width:175px!important}
  .coworxLogoImageWrap,.coworxLogoImage{width:175px!important;max-width:175px!important}
  .headActions{min-width:180px!important}
  .queueGrid{grid-template-columns:minmax(0,1fr) minmax(370px,.82fr)!important}
}
@media (max-width:900px){
  header{height:64px!important;padding:0 16px!important;gap:10px!important}
  .brand{flex:0 0 150px!important;width:150px!important;min-width:150px!important;height:56px!important}
  .coworxLogoImageWrap,.coworxLogoImage{width:150px!important;max-width:150px!important;height:54px!important;max-height:54px!important}
  .desktopNav{display:none!important}
  .headActions{min-width:0!important;gap:7px!important}
  .mobileMenu{padding:14px 16px 22px!important}
  .mobileMenu button{padding:13px 14px!important;border-radius:11px!important}
  .mobileMenu button.active{background:rgba(244,123,32,.10)!important;color:var(--accent)!important}
  .queueGrid{grid-template-columns:1fr!important}
  .offerFormGrid{grid-template-columns:1fr 1fr!important}
  .offerComposer{padding:22px!important}
  .opsTabs{position:static!important}
}
@media (max-width:700px){
  .offerFormGrid{grid-template-columns:1fr!important}
  .composerFooter{align-items:stretch!important}
  .composerFooter .primary{width:100%!important}
  .teamAccessGrid{gap:16px!important}
  .staffRow{grid-template-columns:minmax(0,1fr) auto!important}
  .adminAddRow{grid-template-columns:1fr!important}
}
@media (max-width:620px){
  .brand{flex-basis:132px!important;width:132px!important;min-width:132px!important}
  .coworxLogoImageWrap,.coworxLogoImage{width:132px!important;max-width:132px!important;height:48px!important;max-height:48px!important}
  .simple{padding-top:34px!important}
  .opsPanel{padding:16px!important;border-radius:17px!important}
}
'''
          if '/* 2026 design QA: stable desktop/mobile navigation and spacing */' not in c:
              branding.write_text(c+addon)

          index=Path('index.html')
          index.write_text('<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#e4b51c"/><link rel="manifest" href="/manifest.webmanifest"/><title>Coworx Central · Solapur City</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}</script></body></html>')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/pages/Other.tsx src/branding.css index.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'fix: polish responsive navigation and admin spacing'; git push; fi
      - name: Remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/design-qa-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || (git commit -m 'chore: remove temporary design QA workflow' && git push)
