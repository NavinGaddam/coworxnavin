name: Repair admin operations layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair App routing and CSS include
        shell: python
        run: |
          from pathlib import Path
          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')
          # Ensure Operations is a separate admin page, not nested under AdminPage.
          marker = '{page==="admin"&&user&&role==="Admin"&&<AdminPage'
          if 'page==="operations"&&user&&role==="Admin"&&<main className="simple"><OperationsSuite' not in text:
              insert = '{page==="operations"&&user&&role==="Admin"&&<main className="simple"><OperationsSuite users={users} bookings={staffBookings} admins={admins} adminLogs={adminLogs} actorUid={user.uid} actorEmail={user.email||""} onFlash={setFlash}/></main>}'
              if marker not in text:
                  raise SystemExit('Could not find Admin route marker')
              text = text.replace(marker, insert + ' ' + marker, 1)
          # Remove the embedded OperationsSuite from AdminPage if present.
          embedded = '<OperationsSuite users={users} bookings={allBookings} admins={adminLogs ? admins : admins} adminLogs={adminLogs} actorUid={""} actorEmail={""} onFlash={(m:string)=>window.alert(m)} />'
          text = text.replace(embedded, '')
          generic = '<OperationsSuite users={users} bookings={allBookings} admins={admins} adminLogs={adminLogs} actorUid={""} actorEmail={""} onFlash={(m:string)=>window.alert(m)} />'
          text = text.replace(generic, '')
          app.write_text(text, encoding='utf-8')

          idx = Path('index.html')
          html = idx.read_text(encoding='utf-8')
          html = html.replace('<link rel="stylesheet" href="/design-qa.css"/>','')
          idx.write_text(html, encoding='utf-8')

          legacy = Path('public/design-qa.css')
          if legacy.exists():
              legacy.unlink()
      - name: Verify source is sane
        shell: bash
        run: |
          grep -q 'page==="operations"&&user&&role==="Admin"' src/App.tsx
          ! grep -q 'design-qa.css' index.html
          ! grep -q 'Everything in one control room' src/pages/Other.tsx
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx index.html public/design-qa.css .github/workflows/layout-repair.yml
          git rm --cached .github/workflows/layout-repair.yml 2>/dev/null || true
          git add -A
          git commit -m 'Separate operations page and restore clean responsive layout' || exit 0
          git push