name: Final UI polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped layout, logo, active-nav, and profile settings fixes
        shell: python
        run: |
          from pathlib import Path
          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')

          text = text.replace('import {LogIn,LogOut,Menu,ShieldCheck,X} from "lucide-react";', 'import {LogIn,LogOut,Menu,Settings2,ShieldCheck,X} from "lucide-react";')
          text = text.replace('import "./styles.css";import "./mobile.css";import "./branding.css";', 'import "./styles.css";import "./mobile.css";import "./branding.css";import "./final-polish.css";')

          old_state = 'const [user,setUser]=useState<any>(null),[role,setRole]=useState<Role>("User"),[page,setPage]=useState("home"),[menuOpen,setMenuOpen]=useState(false),[isMobile,setIsMobile]=useState(()=>typeof window!=="undefined"&&window.innerWidth<=900),[theme,setTheme]=useState<"dark"|"light">((localStorage.getItem("coworx-theme") as any)||"dark");'
          new_state = old_state + '\n const [profileOpen,setProfileOpen]=useState(false),[profileForm,setProfileForm]=useState<any>({mobile:"",gender:"",dob:"",profession:""}),[profileSaving,setProfileSaving]=useState(false);'
          if '[profileOpen,setProfileOpen]' not in text:
              if old_state not in text: raise SystemExit('App state marker not found')
              text = text.replace(old_state,new_state,1)

          old_nav = 'const nav=(p:string)=>{if(p==="book"&&!user){setPage("login");setFlash("Google sign-in is required before booking.");return}setPage(p);setMenuOpen(false)};'
          new_nav = old_nav + '\n const openProfile=()=>{setProfileForm({mobile:user?.phoneNumber||localStorage.getItem("coworx-phone")||"",gender:user?.gender||"",dob:user?.dob||"",profession:user?.profession||""});setProfileOpen(true);};\n const saveProfile=async()=>{if(!user)return;const digits=String(profileForm.mobile||"").replace(/\\D/g,"");if(digits.length<10){setFlash("Enter a valid mobile number.");return}if(!String(profileForm.profession||"").trim()){setFlash("Select your profession.");return}setProfileSaving(true);try{await saveUserProfile(user.uid,{phone:String(profileForm.mobile).trim(),gender:String(profileForm.gender||""),dob:String(profileForm.dob||""),profession:String(profileForm.profession||"")});localStorage.setItem("coworx-phone",String(profileForm.mobile).trim());setProfileOpen(false);setFlash("Profile details updated.")}catch(e:any){setFlash(e?.message||"Could not update profile")}finally{setProfileSaving(false)}};'
          if 'const openProfile=' not in text:
              if old_nav not in text: raise SystemExit('App nav marker not found')
              text = text.replace(old_nav,new_nav,1)

          # Replace global <main> wrapper used by Operations with a scoped page wrapper.
          text = text.replace('{page==="operations"&&user&&role==="Admin"&&<main className="simple"><OperationsSuite', '{page==="operations"&&user&&role==="Admin"&&<div className="page opsPage"><OperationsSuite')
          # Close the scoped wrapper at the matching end of the route.
          text = text.replace('onFlash={setFlash}/></main>}', 'onFlash={setFlash}/></div>}', 1)

          # Make email a profile/settings control rather than passive text.
          old_email = '<span className="emailChip">{user.email}</span><button className="logout" onClick={()=>signOut(auth)}>'
          new_email = '<button className="emailChip profileChip" onClick={openProfile} title="Edit profile"><span>{user.email}</span><Settings2 size={14}/></button><button className="logout" onClick={()=>signOut(auth)}>'
          if 'profileChip' not in text:
              if old_email not in text: raise SystemExit('Header email marker not found')
              text = text.replace(old_email,new_email,1)

          # Add modal before footer.
          marker = '<footer><b>coworx central</b>'
          modal = '{profileOpen&&user&&<div className="modalBackdrop profileSettingsBackdrop"><div className="profileSettingsCard"><div className="profileSettingsHead"><div><span className="eyebrow">ACCOUNT SETTINGS</span><h3>Your details</h3><p>Update the contact and professional details used for Coworx Central bookings.</p></div><button className="ghost small" onClick={()=>setProfileOpen(false)}>Close</button></div><div className="profileIdentity"><strong>{user.displayName||"Coworx Member"}</strong><span>{user.email}</span></div><div className="profileSettingsGrid"><label>Mobile number *<input type="tel" inputMode="tel" value={profileForm.mobile||""} onChange={e=>setProfileForm({...profileForm,mobile:e.target.value})} placeholder="+91 98765 43210"/></label><label>Gender<select value={profileForm.gender||""} onChange={e=>setProfileForm({...profileForm,gender:e.target.value})}><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select></label><label>Date of birth<input type="date" value={profileForm.dob||""} onChange={e=>setProfileForm({...profileForm,dob:e.target.value})}/></label><label>Profession<select value={profileForm.profession||""} onChange={e=>setProfileForm({...profileForm,profession:e.target.value})}><option value="">Select profession</option><option>IT Professional</option><option>Developer</option><option>Tester</option><option>Marketing Team</option><option>Student</option><option>Designer</option><option>Consultant</option><option>Business</option><option>Other</option></select></label></div><div className="profileSettingsFooter"><small>Google name and email stay connected to your Google account.</small><button className="primary" onClick={saveProfile} disabled={profileSaving}>{profileSaving?"Saving…":"Save details"}</button></div></div></div>}'
          if 'profileSettingsBackdrop' not in text:
              if marker not in text: raise SystemExit('Footer marker not found')
              text = text.replace(marker,modal+marker,1)

          app.write_text(text,encoding='utf-8')

          css = Path('src/final-polish.css')
          css.write_text(r'''
/* Final scoped UI polish: do not alter the existing global grid. */
.opsPage{width:min(1200px,92%)!important;max-width:1200px!important;margin:0 auto!important;padding:54px 0 80px!important;display:block!important;box-sizing:border-box!important}
.opsPage .opsSuite{width:100%!important;margin:0!important}
.desktopNav button.navActive,.desktopNav .staffNav.navActive{color:var(--text)!important;background:var(--soft)!important;box-shadow:inset 0 -2px 0 var(--line),0 0 0 1px var(--line)!important;border-radius:10px!important}
.mobileMenu button.navActive{color:var(--text)!important;background:var(--soft)!important;box-shadow:inset 0 -2px 0 var(--line),0 0 0 1px var(--line)!important}
.profileChip{max-width:220px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:7px!important;cursor:pointer!important}
.profileChip span{overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
.profileSettingsBackdrop{z-index:100!important}
.profileSettingsCard{width:min(640px,calc(100vw - 28px));max-height:90vh;overflow:auto;padding:26px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 32px 100px rgba(0,0,0,.48)}
.profileSettingsHead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.profileSettingsHead h3{font-size:28px;margin:6px 0 7px}.profileSettingsHead p{margin:0;color:var(--muted);line-height:1.5;font-size:13px}
.profileIdentity{display:grid;gap:3px;padding:14px 16px;margin:20px 0;border:1px solid var(--line);border-radius:14px;background:var(--soft)}.profileIdentity strong{font-size:16px}.profileIdentity span{font-size:12px;color:var(--muted)}
.profileSettingsGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.profileSettingsGrid label{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:800}.profileSettingsGrid input,.profileSettingsGrid select{width:100%;height:48px;padding:0 13px;border:1px solid var(--line);border-radius:13px;background:var(--soft);color:var(--text);outline:none;box-sizing:border-box}.profileSettingsGrid input:focus,.profileSettingsGrid select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,140,255,.13)}
.profileSettingsFooter{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.profileSettingsFooter small{color:var(--muted);line-height:1.45}
@media(max-width:900px){.opsPage{width:min(92%,1200px)!important;padding-top:38px!important}.profileChip{max-width:170px!important}.profileSettingsCard{padding:20px;border-radius:20px}.profileSettingsGrid{grid-template-columns:1fr}.profileSettingsFooter{display:grid;grid-template-columns:1fr}.profileSettingsFooter .primary{width:100%}}
@media(max-width:620px){.profileChip span{display:none}.profileChip{width:40px;min-width:40px;padding:0!important}.opsPage{padding-top:32px!important}}
''',encoding='utf-8')

          # Replace text-only header logo with robust inline wordmark so desktop cannot lose it.
          logo_old = 'const Logo=()=> <span className="coworxLogoImageWrap"><img className="coworxLogoImage" src={COWORX_LOGO} alt="coworx central" loading="eager" decoding="sync" onError={e=>{e.currentTarget.style.display="none"}} /></span>;'
          logo_new = 'const Logo=()=> <span className="coworxLogoWordmark" aria-label="coworx central"><span><i>co</i>worx</span><small>CENTRAL</small></span>;'
          if logo_old in text:
              text = text.replace(logo_old,logo_new,1)
          app.write_text(text,encoding='utf-8')

          with css.open('a',encoding='utf-8') as f:
              f.write(r'''
.coworxLogoWordmark{display:grid!important;line-height:1!important;justify-items:start!important;align-content:center!important;width:178px!important;height:58px!important;overflow:visible!important}.coworxLogoWordmark>span{font-size:31px!important;font-weight:950!important;letter-spacing:-2.7px!important;color:#294985!important}.coworxLogoWordmark i{font-style:normal!important;color:#f47b20!important}.coworxLogoWordmark small{font-size:10px!important;font-weight:900!important;letter-spacing:1.9px!important;color:#294985!important;margin:3px 0 0 1px!important}@media(max-width:900px){.coworxLogoWordmark{width:150px!important}.coworxLogoWordmark>span{font-size:27px!important}}@media(max-width:620px){.coworxLogoWordmark{width:132px!important}.coworxLogoWordmark>span{font-size:25px!important}}
''')
      - name: Build and commit polished UI
        shell: bash
        run: |
          npm install
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/final-polish.css .github/workflows/final-ui-polish.yml
          git commit -m 'Polish responsive layout, navigation, logo, and profile settings' || exit 0
          git push
