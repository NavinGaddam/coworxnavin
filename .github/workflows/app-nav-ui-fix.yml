name: Apply navigation UI fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation and styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace('const resetBook=()=>{setSpace("desk");setSelectedSeats([]);setStaffBooking(false);nav("book")};', 'const resetBook=()=>{setSpace("desk");setSelectedSeats([]);setStaffBooking(false);nav("book")};\n const openOperations=()=>{nav("admin");setTimeout(()=>document.querySelector(".opsSuite")?.scrollIntoView({behavior:"smooth",block:"start"}),120)};')
          s = s.replace('<button onClick={resetBook}>Book</button>', '<button className={page==="book"?"active":""} onClick={resetBook}>Book</button>')
          s = s.replace('<button onClick={()=>nav("bookings")}>My Bookings</button>', '<button className={page==="bookings"?"active":""} onClick={()=>nav("bookings")}>My Bookings</button>')
          s = s.replace('<button onClick={()=>nav("offers")}>Offers</button>', '<button className={page==="offers"?"active":""} onClick={()=>nav("offers")}>Offers</button>')
          s = s.replace('<button onClick={()=>nav("amenities")}>Amenities</button>', '<button className={page==="amenities"?"active":""} onClick={()=>nav("amenities")}>Amenities</button>')
          s = s.replace('<button className="staffNav" onClick={()=>nav("manager")}>Manager', '<button className={`staffNav ${page==="manager"?"active":""}`} onClick={()=>nav("manager")}>Manage Booking')
          marker = '<button className={`staffNav ${page==="manager"?"active":""}`} onClick={()=>nav("manager")}>Manage Booking{pendingBookings.length?` · ${pendingBookings.length}`:""}</button>{role==="Admin"&&user&&<button className="staffNav" onClick={()=>nav("admin")}>Admin</button>}'
          replacement = '<button className={`staffNav ${page==="manager"?"active":""}`} onClick={()=>nav("manager")}>Manage Booking{pendingBookings.length?` · ${pendingBookings.length}`:""}</button>{role==="Admin"&&user&&<><button className={`staffNav opsNav ${page==="admin"?"active":""}`} onClick={openOperations}>Operations</button><button className={`staffNav ${page==="admin"?"active":""}`} onClick={()=>nav("admin")}>Admin</button></>}'
          if marker not in s:
              raise SystemExit('desktop nav marker not found')
          s = s.replace(marker, replacement, 1)
          # mobile labels: replace remaining Manager menu entry and add Operations shortcut
          s = s.replace('<button onClick={()=>nav("manager")}>Manager{pendingBookings.length?` · ${pendingBookings.length}`:""}</button>', '<button className={page==="manager"?"active":""} onClick={()=>nav("manager")}>Manage Booking{pendingBookings.length?` · ${pendingBookings.length}`:""}</button>')
          mobile_marker = '{role==="Admin"&&user&&<button onClick={()=>nav("admin")}>Admin</button>}'
          mobile_replacement = '{role==="Admin"&&user&&<><button onClick={openOperations}>Operations</button><button className={page==="admin"?"active":""} onClick={()=>nav("admin")}>Admin</button></>}'
          if mobile_marker not in s:
              raise SystemExit('mobile nav marker not found')
          s = s.replace(mobile_marker, mobile_replacement, 1)
          p.write_text(s)

          css = Path('src/branding.css')
          c = css.read_text()
          addon = '''\n/* Active navigation state */\n.desktopNav button.active, .mobileMenu button.active {\n  color: var(--accent, #f2c100);\n  background: rgba(242, 193, 0, 0.10);\n}\n.desktopNav button.active {\n  box-shadow: inset 0 -2px 0 var(--accent, #f2c100);\n}\n.desktopNav .opsNav {\n  position: relative;\n}\n@media (min-width: 901px) {\n  .desktopNav .opsNav::after {\n    content: 'ADMIN';\n    display: block;\n    font-size: 8px;\n    line-height: 1;\n    letter-spacing: .12em;\n    opacity: .45;\n    margin-top: 2px;\n  }\n}\n'''
          if '/* Active navigation state */' not in c:
              css.write_text(c + addon)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/branding.css
          git diff --cached --quiet && echo 'No changes needed' && exit 0
          git commit -m 'fix: improve navigation active state and labels'
          git push
          rm -f .github/workflows/app-nav-ui-fix.yml
          git add -A
          git commit -m 'chore: remove one-off navigation fix workflow'
          git push
